name: .NET
#  When this pipeline will be executed
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
# What step are teaken in this pipeline
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
